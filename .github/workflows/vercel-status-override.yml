name: Vercel Status Override

# Cloudripper is a Go CLI, not a Vercel web app. The linked Vercel account is
# blocked and posts a spurious failure on every PR. Deployments are disabled in
# vercel.json; this workflow clears the false-negative status after Vercel runs.

on:
  status:
    types: [completed]

permissions:
  statuses: write

jobs:
  clear-vercel-failure:
    if: >
      github.event.state == 'failure' &&
      github.event.context == 'Vercel' &&
      contains(github.event.description, 'Account is blocked')
    runs-on: ubuntu-latest
    steps:
      - name: Mark Vercel check as neutral (deployments disabled)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.sha,
              state: 'success',
              context: 'Vercel',
              description: 'Git deployments disabled — Cloudripper is a Go CLI',
              target_url: 'https://github.com/${{ github.repository }}/blob/main/vercel.json',
            });
