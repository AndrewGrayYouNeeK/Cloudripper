name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Vet
        run: go vet ./...

      - name: Clear spurious Vercel blocked-account status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            await new Promise((resolve) => setTimeout(resolve, 45000));

            const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });

            const vercel = statuses.find(
              (status) =>
                status.context === 'Vercel' &&
                status.state === 'failure' &&
                status.description?.includes('Account is blocked'),
            );

            if (!vercel) {
              core.info('No blocked Vercel status found; skipping override.');
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'Vercel',
              description: 'Git deployments disabled — Cloudripper is a Go CLI',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/vercel.json`,
            });
