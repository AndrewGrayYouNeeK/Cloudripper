name: cloudripper
runtime:
  name: nodejs
  options:
    typescript: true
main: pulumi/
description: Multi-cloud infrastructure with chaos engineering
config:
  awsRegion:
    description: AWS region
    default: us-east-1
  gcpProject:
    description: Google Cloud project ID
    required: true
  gcpRegion:
    description: Google Cloud region
    default: us-central1
  clusterName:
    description: Cluster name prefix
    default: cloudripper
